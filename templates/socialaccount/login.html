{% extends 'base.html' %}

{% block title %}Continue with {{ provider.name }} — UniTraX{% endblock %}

{% block extra_css %}
<style>
  .auth-wrap {
    min-height: calc(100vh - var(--nav-height) - 80px);
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.5rem;
    box-sizing: border-box;
  }

  .auth-box {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  .auth-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    margin-bottom: 1.25rem;
  }

  .auth-heading {
    font-family: var(--font-head);
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-bottom: 6px;
  }

  .auth-sub {
    color: var(--text-muted);
    font-size: 0.875rem;
    line-height: 1.6;
    margin-bottom: 1.5rem;
  }

  .btn-auth,
  .btn-ghost-auth {
    width: 100%;
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 0.95rem;
    padding: 13px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-auth {
    background: var(--gold);
    color: #0d0d0d;
    border: none;
  }

  .btn-auth:hover {
    background: var(--gold-light);
    transform: translateY(-1px);
  }

  .btn-ghost-auth {
    display: block;
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    text-decoration: none;
    margin-top: 0.75rem;
  }

  .btn-ghost-auth:hover {
    color: var(--gold);
    border-color: rgba(201,168,76,0.45);
  }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-card">
      <h1 class="auth-heading">Continue with {{ provider.name }}</h1>
      <p class="auth-sub">You will be redirected securely to finish signing in.</p>

      <form method="POST" action="{{ request.get_full_path }}">
        {% csrf_token %}
        <button type="submit" class="btn-auth">Continue</button>
      </form>

      <a href="{% url 'accounts:login' %}" class="btn-ghost-auth">Cancel</a>
    </div>
  </div>
</div>
{% endblock %}
