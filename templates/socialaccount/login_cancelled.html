{% extends 'base.html' %}

{% block title %}Google Sign-In Cancelled — UniTraX{% endblock %}

{% block extra_css %}
<style>
  .auth-wrap { min-height: calc(100vh - var(--nav-height) - 80px); width: 100%; display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem; box-sizing: border-box; }
  .auth-box { width: 100%; max-width: 420px; text-align: center; }
  .auth-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; }
  .auth-heading { font-family: var(--font-head); font-size: 1.5rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 6px; }
  .auth-sub { color: var(--text-muted); font-size: 0.875rem; line-height: 1.6; margin-bottom: 1.5rem; }
  .btn-auth { display: block; width: 100%; background: var(--gold); color: #0d0d0d; font-family: var(--font-head); font-weight: 700; font-size: 0.95rem; padding: 13px; border-radius: 10px; border: none; text-decoration: none; transition: all 0.2s; }
  .btn-auth:hover { background: var(--gold-light); color: #0d0d0d; transform: translateY(-1px); }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-card">
      <h1 class="auth-heading">Sign-in cancelled</h1>
      <p class="auth-sub">No changes were made to your account. You can continue whenever you are ready.</p>
      <a href="{% url 'accounts:login' %}" class="btn-auth">Back to Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
