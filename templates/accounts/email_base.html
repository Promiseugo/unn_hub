<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ subject|default:site_name }}</title>
</head>
<body style="margin:0;background:#0d0d0d;color:#f0f0f0;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0d0d0d;padding:28px 14px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#161616;border:1px solid rgba(255,255,255,0.08);border-radius:16px;overflow:hidden;">
          <tr>
            <td style="padding:24px 26px;border-bottom:1px solid rgba(255,255,255,0.08);">
              <div style="font-size:22px;font-weight:800;letter-spacing:-0.02em;color:#f0f0f0;">UniTra<span style="color:#c9a84c;">X</span></div>
              <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.12em;color:#888;margin-top:2px;">Campus Marketplace</div>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 26px 30px;">
              {% block body %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:18px 26px;border-top:1px solid rgba(255,255,255,0.08);color:#888;font-size:12px;line-height:1.6;">
              This message was sent by {{ site_name }}. If this was not you, contact
              <a href="mailto:{{ support_email }}" style="color:#c9a84c;text-decoration:none;">{{ support_email }}</a>.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
