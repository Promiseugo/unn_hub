{% extends 'accounts/email_base.html' %}

{% block body %}
<h1 style="margin:0 0 10px;font-size:24px;line-height:1.25;color:#f0f0f0;">Password changed</h1>
<p style="margin:0 0 18px;color:#d0d0d0;line-height:1.7;font-size:15px;">
  This confirms that the password for your {{ site_name }} account was changed.
</p>
<p style="margin:0 0 18px;color:#d0d0d0;line-height:1.7;font-size:15px;">
  If this was not you, reset your password immediately.
</p>
<a href="{{ protocol }}://{{ domain }}{% url 'accounts:password-reset' %}" style="display:inline-block;background:#c9a84c;color:#0d0d0d;text-decoration:none;font-weight:700;padding:12px 18px;border-radius:10px;">Reset password</a>
{% endblock %}
