{% extends 'base.html' %}

{% block title %}Report safety issue — UniTraX{% endblock %}

{% block content %}
<div class="trust-page" style="padding-block: clamp(1.5rem, 4vw, 3rem);">
  <h1>Report a safety issue</h1>
  <p style="color:var(--text-muted);margin-bottom:1.5rem;">Reports are reviewed by moderators. False reports may lead to restrictions.</p>
  <div class="trust-card">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn-gold" type="submit" style="margin-top:0.5rem;">Submit report</button>
    </form>
  </div>
</div>
{% endblock %}
